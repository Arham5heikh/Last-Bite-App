<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Last Bite sting</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;800&display=swap" rel="stylesheet" />
<style>
  :root { --bg: #121316; --card: #1c1e24; --primary: #ff6b00; --success: #00e599; --warning: #ffb020; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden;
    font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif; color: #f4f4f5; }
  .stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .glow { position: absolute; width: 60vmin; height: 60vmin; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,107,0,.35), rgba(255,107,0,0) 65%);
    opacity: 0; animation: glow 1.6s .5s ease-out forwards; }
  .mark { width: 22vmin; height: 22vmin; transform: scale(0) rotate(-18deg);
    animation: pop .75s cubic-bezier(.34,1.56,.64,1) .15s forwards; filter: drop-shadow(0 1.5vmin 4vmin rgba(255,107,0,.35)); }
  .tine { transform: translateY(-40px); opacity: 0; animation: drop .45s cubic-bezier(.34,1.56,.64,1) forwards; }
  .t1 { animation-delay: .55s } .t2 { animation-delay: .65s } .t3 { animation-delay: .75s }
  .head { opacity: 0; animation: fade .3s .8s forwards; }
  .bolt { opacity: 0; transform-origin: 32px 33px; animation: strike .55s 1.0s ease-out forwards; }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; animation: flash .5s 1.05s ease-out; pointer-events: none; }
  .word { margin-top: 4vmin; font-weight: 800; font-size: 9vmin; letter-spacing: -.03em; opacity: 0;
    transform: translateY(3vmin); animation: rise .6s 1.35s ease-out forwards; }
  .word span { color: var(--primary); }
  .tag { margin-top: 2vmin; font-weight: 500; font-size: 4.2vmin; color: var(--warning); opacity: 0;
    transform: translateY(2vmin); animation: rise .6s 1.9s ease-out forwards; }
  .tag b { color: var(--success); font-weight: 800; }
  .sparks i { position: absolute; width: 1.2vmin; height: 1.2vmin; border-radius: 50%; opacity: 0;
    animation: spark 1.1s 1.05s ease-out forwards; }
  @keyframes pop { to { transform: scale(1) rotate(0) } }
  @keyframes drop { to { transform: translateY(0); opacity: 1 } }
  @keyframes fade { to { opacity: 1 } }
  @keyframes strike { 0% { opacity: 0; transform: scale(1.8) } 40% { opacity: 1 } 100% { opacity: 1; transform: scale(1) } }
  @keyframes flash { 0% { opacity: .35 } 100% { opacity: 0 } }
  @keyframes glow { 0% { opacity: 0; transform: scale(.4) } 60% { opacity: 1 } 100% { opacity: .55; transform: scale(1.25) } }
  @keyframes rise { to { opacity: 1; transform: translateY(0) } }
  @keyframes spark { 0% { opacity: 1; transform: translate(0,0) scale(1) } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.2) } }
</style>
</head>
<body>
<div class="flash"></div>
<div class="stage">
  <div class="glow"></div>
  <div class="sparks" id="sparks"></div>
  <svg class="mark" viewBox="0 0 64 64" aria-label="Last Bite">
    <rect width="64" height="64" rx="16" fill="var(--primary)" />
    <g fill="var(--bg)">
      <rect class="tine t1" x="21" y="9" width="5" height="17" rx="2.5" />
      <rect class="tine t2" x="29.5" y="9" width="5" height="17" rx="2.5" />
      <rect class="tine t3" x="38" y="9" width="5" height="17" rx="2.5" />
      <path class="head" d="M21 22h22v3.5c0 4.6-3.4 8.2-7.8 8.5H28.8C24.4 33.7 21 30.1 21 25.5z" />
      <path class="bolt" d="M28.5 33h8.5l-4.2 9.2h6.7L26.2 58.5l3.6-11.7h-6.4z" />
    </g>
  </svg>
  <div class="word">Last <span>Bite</span></div>
  <div class="tag" id="tag"></div>
</div>
<script>
  // ?tag=... sets the tagline under the wordmark (empty for the intro sting)
  const params = new URLSearchParams(location.search);
  const tag = params.get('tag') || '';
  const el = document.getElementById('tag');
  el.innerHTML = tag.replace(/\*(.+?)\*/g, '<b>$1</b>');
  if (!tag) el.remove();

  const sparks = document.getElementById('sparks');
  const colors = ['#ff6b00', '#ffb020', '#00e599'];
  for (let i = 0; i < 14; i++) {
    const s = document.createElement('i');
    const a = (i / 14) * Math.PI * 2;
    s.style.background = colors[i % 3];
    s.style.setProperty('--dx', `${Math.cos(a) * 22}vmin`);
    s.style.setProperty('--dy', `${Math.sin(a) * 22 - 6}vmin`);
    s.style.top = 'calc(50% - 6vmin)';
    s.style.left = '50%';
    sparks.appendChild(s);
  }
</script>
</body>
</html>
